services:
  - type: web
    name: mentor-match-ai
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@mentormatch.ai
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PAYMENT_MODE
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      - key: SLOT_LOCK_MINUTES
        value: "10"
      - key: FREE_CANCEL_HOURS
        value: "24"
      - key: MIN_BOOKING_LEAD_HOURS
        value: "2"
