name: Deploy to Production (AWS ECS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        id: check-creds
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          if [ -z "$AWS_KEY" ] || [ -z "$AWS_SECRET" ] || [ -z "$AWS_REGION" ] || [ -z "$ECR_REGISTRY" ]; then
            echo "::notice ::Required deployment secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, ECR_REGISTRY) are not configured. Skipping ECS deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.check-creds.outputs.configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Backend to ECR
        if: steps.check-creds.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/mentor-match-backend:$IMAGE_TAG -t $ECR_REGISTRY/mentor-match-backend:latest -f backend/Dockerfile.prod backend
          docker push $ECR_REGISTRY/mentor-match-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/mentor-match-backend:latest

      - name: Build, tag, and push Frontend to ECR
        if: steps.check-creds.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/mentor-match-frontend:$IMAGE_TAG -t $ECR_REGISTRY/mentor-match-frontend:latest -f frontend/Dockerfile.prod frontend
          docker push $ECR_REGISTRY/mentor-match-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/mentor-match-frontend:latest

      - name: Build, tag, and push ML Service to ECR
        if: steps.check-creds.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/mentor-match-ml-service:$IMAGE_TAG -t $ECR_REGISTRY/mentor-match-ml-service:latest -f ml-service/Dockerfile ml-service
          docker push $ECR_REGISTRY/mentor-match-ml-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/mentor-match-ml-service:latest

      - name: Trigger ECS Service Redeploy
        if: steps.check-creds.outputs.configured == 'true'
        run: |
          aws ecs update-service --cluster mentor-match-cluster --service mentor-match-backend-service --force-new-deployment
          aws ecs update-service --cluster mentor-match-cluster --service mentor-match-frontend-service --force-new-deployment
          aws ecs update-service --cluster mentor-match-cluster --service mentor-match-ml-service --force-new-deployment
