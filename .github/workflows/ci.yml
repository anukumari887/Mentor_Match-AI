name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Lint backend code
        run: npm --prefix backend run lint

      - name: Run backend tests
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/mentor_match_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: dev_only_super_secret_jwt_key_32_bytes_min_ci!
          JWT_EXPIRES_IN: 7d
          CORS_ORIGIN: http://localhost:3000
          ML_SERVICE_URL: http://localhost:8000
          PAYMENT_MODE: mock
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          EMAIL_FROM: noreply@mentormatch.test
          COOKIE_SECURE: "false"
        run: npm --prefix backend test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build frontend production bundle
        run: npm --prefix frontend run build

      - name: Install ML service dependencies
        run: pip install -r ml-service/requirements.txt

      - name: Run ML service tests
        env:
          PYTHONPATH: ml-service
        run: python -m pytest -q ml-service/tests

  build-docker-images:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: mentor-match-backend:ci

      - name: Build frontend production image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: mentor-match-frontend:ci

      - name: Build ML service production image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: false
          tags: mentor-match-ml-service:ci
