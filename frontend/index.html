<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfbfa" />
    <title>Mentor-Match AI | Thoughtful 1-on-1 Mentorship</title>
    <meta name="description" content="Connect directly with experienced engineers, architects, and technical leads for focused 1-on-1 mentorship sessions." />

    <!-- OpenGraph / Social Share Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mentor-Match AI | Direct 1-on-1 Engineering Mentorship" />
    <meta property="og:description" content="Connect directly with experienced engineers, architects, and technical leads for focused 1-on-1 mentorship sessions." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mentor-Match AI — Direct 1-on-1 mentorship with practicing engineers" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mentor-Match AI | Direct 1-on-1 Engineering Mentorship" />
    <meta name="twitter:description" content="Connect directly with experienced engineers, architects, and technical leads for focused 1-on-1 mentorship sessions." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Mentor-Match AI platform preview" />
    <script>
      (function() {
        try {
          var validThemes = ['light', 'dark', 'paper', 'midnight', 'forest', 'high-contrast'];
          var themeColors = {
            'light': '#fcfbfa',
            'dark': '#1a1a1c',
            'paper': '#f5efe6',
            'midnight': '#0d1522',
            'forest': '#f2f6f2',
            'high-contrast': '#ffffff'
          };
          var saved = localStorage.getItem('mentor-match-theme');
          var theme = (validThemes.indexOf(saved) !== -1) ? saved : null;
          if (!theme) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = (theme === 'dark' || theme === 'midnight') ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', themeColors[theme] || '#fcfbfa');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
